<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شهادة تقدير</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: 'Amiri', serif;
      background: #f5f0e6;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #4b2e2e;
    }

    .certificate-container {
      border: 6px double #8b5e3c;
      border-radius: 20px;
      margin: 20px auto;
      padding: 40px;
      background: #fffaf0;
      width: 90%;
      max-width: 800px;
      position: relative;
    }

    h1.title {
      font-size: 40px;
      margin: 10px 0;
      border: 2px dotted #a67c52;
      padding: 10px;
      background-color: #fcebd2;
      display: inline-block;
      position: relative;
    }

    .medal {
      width: 32px;
      vertical-align: middle;
      margin: 0 10px;
    }

    .input-section {
      background-color: #f3e5d1;
      padding: 20px;
      border-radius: 15px;
      margin: 20px auto;
      width: 90%;
      max-width: 600px;
      border: 2px dotted #a67c52;
    }

    .input-section input, select, textarea {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 90%;
      font-size: 16px;
      text-align: center;
      border-radius: 10px;
      border: 1px solid #a67c52;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      background-color: #f5d7a1;
      color: #000;
      padding: 10px 20px;
      margin: 10px 5px;
      border: 2px solid #8b5e3c;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    #popup {
      display: none;
      background-color: #f9f1e5;
      border-radius: 15px;
      padding: 20px;
      margin: 20px auto;
      width: 90%;
      max-width: 500px;
      border: 2px solid #8b5e3c;
    }

    #timer-label {
      font-size: 20px;
      margin-bottom: 10px;
    }

    #timer {
      font-size: 28px;
      font-weight: bold;
    }

    #final-certificate {
      display: none;
      margin: 30px auto;
    }

    .recipient {
      font-size: 28px;
      font-weight: bold;
      background-color: #fcebd2;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      margin: 10px 0 20px;
    }

    .grade {
      font-size: 22px;
      margin-top: 5px;
    }

    .thanks {
      font-size: 20px;
      margin-top: 20px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .school-director {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
      font-weight: bold;
      flex-wrap: wrap;
      align-items: center;
    }

    .signature {
      text-align: center;
      flex: 1;
    }

    .footer-buttons {
      margin-top: 20px;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 70px;
    }
  </style>
</head>
<body>

  <div class="input-section">
    <h2>بيانات الشهادة</h2>
    <select id="type" onchange="hideCertificate()">
      <option value="الطالب">الطالب</option>
      <option value="الطالبة">الطالبة</option>
    </select>
    <input type="text" id="name" placeholder="أدخل الاسم هنا" oninput="hideCertificate()">
    <input type="text" id="grade" placeholder="أدخل الصف" oninput="hideCertificate()">
    <input type="text" id="school" placeholder="أدخل اسم المدرسة" oninput="hideCertificate()">
    <input type="text" id="director" placeholder="أدخل اسم المدير/ة" oninput="hideCertificate()">
    <textarea id="thanks" placeholder="اكتب عبارات الشكر هنا..." oninput="hideCertificate()"></textarea>
    <button class="btn" onclick="showPopup()">عرض الشهادة</button>
  </div>

  <div id="popup">
    <div id="timer-label">جاري إصدار الشهادة</div>
    <div id="timer">01:00</div>
    <p>يرجى الاشتراك:</p>
    <a class="btn" href="youtube://UCOyD7hrUD4FH02uSaHkVd6A" target="_blank">اليوتيوب</a>
    <a class="btn" href="twitter://user?screen_name=forms_teachers" target="_blank">X (تويتر)</a>
  </div>

  <div id="final-certificate" class="certificate-container">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/ar/thumb/8/88/Ministry_of_Education_Saudi_Arabia_logo.svg/2560px-Ministry_of_Education_Saudi_Arabia_logo.svg.png" alt="شعار الوزارة" onerror="this.style.display='none'">
    
    <h1 class="title">
      <img class="medal" src="https://cdn-icons-png.flaticon.com/512/2583/2583391.png">
      شهادة تقدير
      <img class="medal" src="https://cdn-icons-png.flaticon.com/512/2583/2583391.png">
    </h1>

    <div id="student-name" class="recipient"></div>
    <div id="student-grade" class="grade"></div>
    <div class="thanks" id="thanks-message"></div>

    <div class="school-director">
      <span id="school-name"></span>
      <div class="signature">توقيع المدير/ة</div>
      <span id="director-name"></span>
    </div>
  </div>

  <div class="footer-buttons">
    <button class="btn" onclick="saveAsImage()">حفظ الصورة</button>
    <button class="btn" onclick="saveAsPDF()">تحويل إلى PDF</button>
    <button class="btn" onclick="shareCertificate()">مشاركة</button>
  </div>

  <script>
    let countdown;
    function showPopup() {
      document.getElementById('popup').style.display = 'block';
      let time = 60;
      updateTimer(time);
      countdown = setInterval(() => {
        time--;
        updateTimer(time);
        if (time <= 0) {
          clearInterval(countdown);
          document.getElementById('popup').style.display = 'none';
          showCertificate();
        }
      }, 1000);
    }

    function updateTimer(seconds) {
      const min = String(Math.floor(seconds / 60)).padStart(2, '0');
      const sec = String(seconds % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${min}:${sec}`;
    }

    function showCertificate() {
      const type = document.getElementById('type').value;
      const name = document.getElementById('name').value;
      const grade = document.getElementById('grade').value;
      const school = document.getElementById('school').value;
      const director = document.getElementById('director').value;
      const thanksText = document.getElementById('thanks').value;

      document.getElementById('student-name').textContent = `${type} : ${name}`;
      document.getElementById('student-grade').textContent = `الصف: ${grade}`;
      document.getElementById('school-name').textContent = `المدرسة: ${school}`;
      document.getElementById('director-name').textContent = `المدير/ة: ${director}`;
      document.getElementById('thanks-message').textContent = thanksText;

      document.getElementById('final-certificate').style.display = 'block';
    }

    function hideCertificate() {
      document.getElementById('final-certificate').style.display = 'none';
    }

    async function saveAsPDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      const cert = document.getElementById("final-certificate");
      const canvas = await html2canvas(cert);
      const imgData = canvas.toDataURL("image/png");
      pdf.addImage(imgData, 'PNG', 10, 10, 190, 0);
      pdf.save("certificate.pdf");
    }

    async function saveAsImage() {
      const cert = document.getElementById("final-certificate");
      const canvas = await html2canvas(cert);
      const link = document.createElement("a");
      link.download = "certificate.png";
      link.href = canvas.toDataURL();
      link.click();
    }

    function shareCertificate() {
      const text = "أنشأت شهادة تقدير رائعة، جرب الآن!";
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: "شهادة تقدير",
          text,
          url,
        }).catch(console.error);
      } else {
        alert("ميزة المشاركة غير مدعومة في هذا المتصفح.");
      }
    }
  </script>
</body>
</html>
